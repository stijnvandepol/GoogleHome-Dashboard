name: Deploy Dashboard

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Verify Docker tooling
        run: |
          docker --version
          docker compose version

      - name: Configure Docker daemon (IPv4 only)
        run: |
          echo '{"ipv6": false}' | sudo tee /etc/docker/daemon.json
          sudo systemctl reload docker

      - name: Schrijf .env uit secret
        run: |
          # Ruim een eventueel per ongeluk aangemaakte .env-map op, zodat
          # de bind-mount (./.env:/app/camera.env) altijd een bestand vindt.
          rm -rf .env
          cat > .env <<'CAMERA_ENV_EOF'
          ${{ secrets.CAMERA_ENV }}
          CAMERA_ENV_EOF

      - name: Deploy stack
        run: docker compose up -d --build --remove-orphans

      - name: Recreate pagecaster for layout updates
        run: docker compose up -d --force-recreate --no-deps pagecaster-dashboard

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show recent logs on failure
        if: failure()
        run: docker compose logs --tail=200
