services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard_frontend
    ports:
      - "8080:80"
    environment:
      - KNMI_API_KEY=${KNMI_API_KEY}
    depends_on:
      - camera-proxy
    networks:
      - dashboardnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  camera-proxy:
    build:
      context: ./frontend/camera-proxy
    container_name: dashboard_camera_proxy
    # .env wordt read-only gemount en door proxy.py zelf gelezen, zodat een
    # wachtwoord met $-tekens niet door compose-substitutie verminkt wordt.
    volumes:
      - ./.env:/app/camera.env:ro
    networks:
      - dashboardnet
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: dashboard_rtsp
    ports:
      - "8554:8554"
    networks:
      - dashboardnet
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  pagecaster-dashboard:
    image: ghcr.io/rmitchellscott/pagecaster:latest
    container_name: dashboard_pagecaster
    depends_on:
      frontend:
        condition: service_healthy
      rtsp-server:
        condition: service_started
    restart: unless-stopped
    environment:
      - WEB_URL=http://frontend
      - AUDIO_SOURCE=silent
      - RTMP_URL=rtmp://rtsp-server:1935/dashboard
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=720
      - FRAMERATE=3
      - FFMPEG_PRESET=veryfast
    shm_size: "512m"
    networks:
      - dashboardnet
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  dashboardnet:
    driver: bridge
