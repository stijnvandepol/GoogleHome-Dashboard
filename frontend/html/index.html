<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>TV Dashboard</title>
  <style>
    /* Base */
    :root {
      font-size: 16px;
      color-scheme: dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #000000;
      height: 100%;
      overflow: hidden;
    }

    body {
      width: 1280px;
      height: 720px;
      margin: 0 auto;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 12px 30px 18px;
    }

    /* Layout */
    .dashboard {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 12px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 6px;
    }

    .clock {
      font-size: 96px;
      font-weight: 200;
      letter-spacing: 2px;
      color: #f5f5f5;
      text-shadow: 0 2px 20px rgba(0,0,0,0.4);
    }

    .date {
      font-size: 28px;
      color: #9a9a9a;
      text-transform: capitalize;
      font-weight: 300;
    }

    .presence {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .presence-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #7a7a7a;
    }

    .presence-list {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      max-width: 520px;
    }

    .presence-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      color: #e8e8e8;
      font-weight: 600;
      font-size: 18px;
      backdrop-filter: blur(6px) saturate(120%);
      box-shadow: 0 6px 16px rgba(0,0,0,0.45);
      white-space: nowrap;
    }

    .presence-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .presence-more {
      opacity: 0.9;
      background: rgba(255,255,255,0.03);
    }

    .presence-empty {
      font-size: 16px;
      color: #6a6a6a;
      font-weight: 300;
    }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: 420px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "weather news"
        "homey news";
      gap: 15px;
      flex: 1;
    }

    .card {
      background: linear-gradient(135deg, rgba(40,40,40,0.3) 0%, rgba(25,25,25,0.5) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 22px;
      backdrop-filter: blur(40px) saturate(150%);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        0 2px 8px rgba(0,0,0,0.2),
        inset 0 1px 1px rgba(255,255,255,0.1),
        inset 0 -1px 1px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 55%, transparent 100%);
      transform: translateX(-100%);
      pointer-events: none;
    }

    #weather-card { grid-area: weather; }
    #homey-card { grid-area: homey; }
    .news-card { grid-area: news; }

    /* Components */
    .card-title {
      font-size: 26px;
      font-weight: 400;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #b8b8b8;
      letter-spacing: 0.5px;
    }

    .weather-main {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .weather-temp {
      font-size: 80px;
      font-weight: 200;
      color: #f0f0f0;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
      white-space: nowrap;
    }

    .weather-desc {
      font-size: 28px;
      color: #a0a0a0;
      font-weight: 300;
    }

    .weather-details {
      margin-top: 22px;
      font-size: 22px;
      color: #8a8a8a;
      line-height: 1.6;
      font-weight: 300;
    }

    .weather-updated {
      margin-top: 10px;
      font-size: 16px;
      color: #6f6f6f;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 20px;
      font-size: 20px;
      color: #c0c0c0;
    }

    .metric-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #7a7a7a;
      margin-bottom: 6px;
      font-weight: 400;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 300;
      color: #d8d8d8;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      overflow: hidden;
    }

    .news-item {
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .news-headline {
      font-size: 22px;
      font-weight: 400;
      color: #e0e0e0;
      line-height: 1.4;
    }

    .news-meta {
      margin-top: 8px;
      font-size: 18px;
      color: #6a6a6a;
      font-weight: 300;
    }

    .loading {
      font-size: 24px;
      color: #7a7a7a;
      font-weight: 300;
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <header class="header">
      <div>
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date">Datum laden...</div>
      </div>
      <div class="presence" id="presence">
        <div class="presence-label">Thuis</div>
        <div class="presence-list">
          <div class="presence-empty">Laden...</div>
        </div>
      </div>
    </header>

    <section class="cards">
      <article class="card" id="weather-card">
        <div class="card-title">Weer</div>
        <div id="weather" class="loading">Weer laden...</div>
      </article>

      <article class="card" id="homey-card">
        <div id="homey" class="loading">Thuisdata laden...</div>
      </article>

      <article class="card news-card">
        <div class="card-title">Nieuws</div>
        <div id="news" class="news-list">
          <div class="loading">Nieuws laden...</div>
        </div>
      </article>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const CONFIG = {
        homeyApi: window.HOMEY_API || 'http://192.168.1.21:3000/BaYYjdNFpMdyeqOTRHpbYzLTbRTRgu',
        knmiApiKey: window.KNMI_API_KEY || '',
        knmiStationId: window.KNMI_STATION_ID || '0-20000-0-06375',
        knmiStationLabel: window.KNMI_STATION_LABEL || '',
        knmiEdrBase: 'https://api.dataplatform.knmi.nl/edr/v1/collections/10-minute-in-situ-meteorological-observations',
        knmiProxyBase: '/knmi',
        weatherCacheKey: 'dashboard-weather-cache-v1',
        newsFeed: 'http://feeds.nos.nl/nosnieuwsalgemeen',
        newsApi: 'https://api.rss2json.com/v1/api.json'
      };

      const INTERVALS = {
        clock: 1000,
        weather: 300000,
        news: 600000,
        homey: 60000
      };

      const PRESENCE_PERSONS = [
        { key: 'aanwezigheid_stijn', color: '#3b82f6', name: 'Stijn' },
        { key: 'aanwezigheid_britt', color: '#facc15', name: 'Britt' },
        { key: 'aanwezigheid_rens', color: '#22c55e', name: 'Rens' },
        { key: 'aanwezigheid_sandra', color: '#8b5cf6', name: 'Sandra' },
        { key: 'aanwezigheid_alfredo', color: '#ef4444', name: 'Alfredo' }
      ];

      const DOM = {
        clock: document.getElementById('clock'),
        date: document.getElementById('date'),
        presence: document.getElementById('presence'),
        weather: document.getElementById('weather'),
        homey: document.getElementById('homey'),
        news: document.getElementById('news')
      };

      function setHTML(el, html) {
        if (el) el.innerHTML = html;
      }

      function setText(el, text) {
        if (el) el.textContent = text;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatNumber(value, decimals, suffix = '') {
        if (value === undefined || value === null || Number.isNaN(value)) {
          return '--';
        }
        return `${Number(value).toFixed(decimals)}${suffix}`;
      }

      function formatWeatherTimestamp(value) {
        if (!value) return 'Onbekend';
        const date = value instanceof Date ? value : new Date(value);
        if (Number.isNaN(date.getTime())) return 'Onbekend';
        return date.toLocaleString('nl-NL', {
          day: '2-digit',
          month: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          timeZone: 'Europe/Amsterdam'
        });s
      }

      function timeAgo(date) {
        const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
        if (seconds < 60) return 'Zojuist';
        if (seconds < 3600) return `${Math.floor(seconds / 60)} minuten geleden`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)} uur geleden`;
        return `${Math.floor(seconds / 86400)} dagen geleden`;
      }

      function buildKnmiUrl(endpoint, params) {
        const base = CONFIG.knmiProxyBase || CONFIG.knmiEdrBase;
        const baseUrl = CONFIG.knmiProxyBase ? window.location.origin : undefined;
        const url = new URL(`${base.replace(/\/$/, '')}/${endpoint}`, baseUrl);
        Object.entries(params || {}).forEach(([key, value]) => {
          if (value !== undefined && value !== null && value !== '') {
            url.searchParams.set(key, value);
          }
        });
        return url.toString();
      }

      function getCoverage(data) {
        if (Array.isArray(data?.coverages) && data.coverages.length > 0) {
          return data.coverages[0];
        }
        if (data?.coverage) return data.coverage;
        return data;
      }

      function getTimeAxis(coverage) {
        const axes = coverage?.domain?.axes || {};
        return axes.t?.values || axes.time?.values || axes.datetime?.values || [];
      }

      function getUnit(coverage, paramName) {
        const unit = coverage?.parameters?.[paramName]?.unit;
        return unit?.symbol || unit?.label || '';
      }

      function extractLatestValue(coverage, paramName) {
        const range = coverage?.ranges?.[paramName];
        const values = range?.values || [];
        const times = getTimeAxis(coverage);
        for (let i = values.length - 1; i >= 0; i -= 1) {
          const v = values[i];
          if (v !== null && v !== undefined && !Number.isNaN(v)) {
            return {
              value: v,
              time: times[i] || null,
              unit: getUnit(coverage, paramName)
            };
          }
        }
        return { value: null, time: null, unit: getUnit(coverage, paramName) };
      }

      function saveWeatherCache(payload) {
        try {
          localStorage.setItem(CONFIG.weatherCacheKey, JSON.stringify(payload));
        } catch (err) {
          console.warn('Weather cache save failed', err);
        }
      }

      function loadWeatherCache() {
        try {
          const raw = localStorage.getItem(CONFIG.weatherCacheKey);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (err) {
          console.warn('Weather cache load failed', err);
          return null;
        }
      }

      function renderWeather(payload, isFallback = false) {
        if (!payload) return false;
        const temp = formatNumber(payload.temp, 1, payload.tempSuffix || '°C');
        const humidity = formatNumber(payload.humidity, 0, payload.humiditySuffix || '%');
        const wind = formatNumber(payload.wind, 1, payload.windSuffix || ' m/s');
        const desc = payload.desc || '';
        const updated = formatWeatherTimestamp(payload.updatedAt);
        const fallbackNote = isFallback ? ' (laatste meting)' : '';

        setHTML(DOM.weather, `
          <div class="weather-main">
            <div class="weather-temp">${temp}</div>
            <div class="weather-desc">${desc}</div>
          </div>
          <div class="weather-details">
            Luchtvochtigheid: ${humidity}<br>
            Wind: ${wind}
            <div class="weather-updated">Laatst bijgewerkt: ${updated}${fallbackNote}</div>
          </div>
        `);
        return true;
      }

      function renderPresence(data) {
        if (!DOM.presence) return;

        const active = PRESENCE_PERSONS.filter(p => data[p.key]);
        if (active.length === 0) {
          setHTML(DOM.presence, `
            <div class="presence-label">Thuis</div>
            <div class="presence-list">
              <div class="presence-empty">Niemand</div>
            </div>
          `);
          return;
        }

        const maxVisible = 5;
        const visible = active.slice(0, maxVisible);
        const pills = visible.map(p => `
          <div class="presence-pill" title="${escapeHtml(p.name)}">
            <span class="presence-dot" style="background:${p.color};"></span>
            <span class="presence-name">${escapeHtml(p.name)}</span>
          </div>
        `);

        if (active.length > maxVisible) {
          const remaining = active.length - maxVisible;
          const remainingNames = active.slice(maxVisible).map(p => p.name).join(', ');
          pills.push(`<div class="presence-pill presence-more" title="${escapeHtml(remainingNames)}">+${remaining} meer</div>`);
        }

        setHTML(DOM.presence, `
          <div class="presence-label">Thuis</div>
          <div class="presence-list">
            ${pills.join('')}
          </div>
        `);
      }

      function updateTime() {
        const now = new Date();
        const clock = now.toLocaleTimeString('nl-NL', {
          hour: '2-digit',
          minute: '2-digit',
          timeZone: 'Europe/Amsterdam'
        });
        const date = now.toLocaleDateString('nl-NL', {
          weekday: 'long',
          day: 'numeric',
          month: 'long',
          year: 'numeric',
          timeZone: 'Europe/Amsterdam'
        });
        setText(DOM.clock, clock);
        setText(DOM.date, date);
      }

      async function getWeather() {
        try {
          const cached = loadWeatherCache();
          if (cached) {
            renderWeather(cached, true);
          }

          const useProxy = CONFIG.knmiProxyBase && CONFIG.knmiProxyBase.startsWith('/');
          if ((!useProxy && !CONFIG.knmiApiKey) || CONFIG.knmiStationId.includes('XXXXX')) {
            setHTML(DOM.weather, '<div class="loading">Stel KNMI_API_KEY en KNMI_STATION_ID in</div>');
            return;
          }

          const now = new Date();
          const start = new Date(now.getTime() - 2 * 60 * 60 * 1000);
          const datetime = `${start.toISOString()}/${now.toISOString()}`;

          const url = buildKnmiUrl(`locations/${CONFIG.knmiStationId}`, {
            'parameter-name': 'ta,rh,ff',
            datetime
          });

          const resp = await fetch(url, useProxy ? {} : {
            headers: { Authorization: CONFIG.knmiApiKey }
          });
          if (!resp.ok) throw new Error(`KNMI HTTP ${resp.status}`);
          const data = await resp.json();
          const coverage = getCoverage(data);

          const ta = extractLatestValue(coverage, 'ta');
          const rh = extractLatestValue(coverage, 'rh');
          const ff = extractLatestValue(coverage, 'ff');

          const payload = {
            temp: ta.value,
            tempSuffix: ta.unit || '°C',
            humidity: rh.value,
            humiditySuffix: rh.unit ? ` ${rh.unit}` : '%',
            wind: ff.value,
            windSuffix: ff.unit ? ` ${ff.unit}` : ' m/s',
            desc: CONFIG.knmiStationLabel ? `KNMI ${CONFIG.knmiStationLabel}` : '',
            updatedAt: ta.time || rh.time || ff.time || new Date().toISOString()
          };

          saveWeatherCache(payload);
          renderWeather(payload);
        } catch (err) {
          console.error('Weather fetch error', err);
          const cached = loadWeatherCache();
          if (!renderWeather(cached, true)) {
            setHTML(DOM.weather, '<div class="loading">Weerdata wordt bijgewerkt</div>');
          }
        }
      }

      async function getNews() {
        try {
          const url = `${CONFIG.newsApi}?rss_url=${encodeURIComponent(CONFIG.newsFeed)}`;
          const resp = await fetch(url);
          const data = await resp.json();
          if (!data?.items || data.items.length === 0) {
            setHTML(DOM.news, '<div class="loading">Geen nieuws beschikbaar</div>');
            return;
          }

          const items = data.items.slice(0, 4)
            .map(item => {
              const date = new Date(item.pubDate);
              return `
                <div class="news-item">
                  <div class="news-headline">${escapeHtml(item.title)}</div>
                  <div class="news-meta">${timeAgo(date)}</div>
                </div>`;
            })
            .join('');

          setHTML(DOM.news, items);
        } catch (err) {
          console.error('News fetch error', err);
          setHTML(DOM.news, '<div class="loading">Kon nieuws niet laden</div>');
        }
      }

      async function getHomeyStatus() {
        try {
          const resp = await fetch(CONFIG.homeyApi);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

          const payload = await resp.json();
          const data = payload?.data?.home || {};

          const tBinnen = formatNumber(data.temperatuur_binnen, 1, '°C');
          const tSet = formatNumber(data.temperatuur_ingesteld, 1, '°C');
          const stroom = formatNumber(data.stroomverbruik_vandaag, 2, ' kWh');
          const gas = formatNumber(data.gasverbruik_vandaag, 3, ' m³');

          setHTML(DOM.homey, `
            <div class="metrics">
              <div>
                <div class="metric-label">Temp. binnen</div>
                <div class="metric-value">${tBinnen}</div>
              </div>
              <div>
                <div class="metric-label">Temp. ingesteld</div>
                <div class="metric-value">${tSet}</div>
              </div>
              <div>
                <div class="metric-label">Stroom vandaag</div>
                <div class="metric-value">${stroom}</div>
              </div>
              <div>
                <div class="metric-label">Gas vandaag</div>
                <div class="metric-value">${gas}</div>
              </div>
            </div>
          `);

          renderPresence(data);
        } catch (err) {
          console.error('Homey fetch error', err);
          setHTML(DOM.homey, '<div class="loading">Kon Homey data niet laden</div>');
          setHTML(DOM.presence, `
            <div class="presence-label">Thuis</div>
            <div class="presence-list">
              <div class="presence-empty">Onbekend</div>
            </div>
          `);
        }
      }

      function init() {
        updateTime();
        getWeather();
        getNews();
        getHomeyStatus();

        setInterval(updateTime, INTERVALS.clock);
        setInterval(getWeather, INTERVALS.weather);
        setInterval(getNews, INTERVALS.news);
        setInterval(getHomeyStatus, INTERVALS.homey);
      }

      init();
    })();
  </script>
</body>
</html>
